name = "amilliondreams"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

[vars]
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEp3vW0v0bnYDXkK"
# TURNSTILE_HOSTNAMES defaults to "amilliondreams.llc,amilliondreams.pages.dev" in the function

# Secrets (set in Pages dashboard → Settings → Environment variables):
#   TURNSTILE_SECRET_KEY   — Cloudflare Turnstile secret key
#   CONTACT_TO             — your real inbox address
#   CONTACT_FROM           — send-from address (optional, default: noreply@amilliondreams.llc)
#
# Email is sent via the amd-mailer Worker (workers/mailer/).
# The Pages Function calls it via fetch("https://amd-mailer.<account>.workers.dev/send")
# with a shared MAILER_SECRET for auth.
# Set MAILER_SECRET as an encrypted secret in both:
#   - Pages dashboard (used by the Pages Function to authenticate outbound calls)
#   - amd-mailer Worker secrets (used to verify incoming calls)
