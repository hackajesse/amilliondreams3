name = "amilliondreams"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

[vars]
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEp3vW0v0bnYDXkK"
# TURNSTILE_HOSTNAMES defaults to "amilliondreams.llc,amilliondreams.pages.dev" in the function

# Pages env (dashboard → Settings → Environment variables, Production):
#   TURNSTILE_SECRET_KEY   — Turnstile secret
#   MAILER_URL             — amd-mailer base URL (no /send), e.g. https://amd-mailer.<account>.workers.dev
#   MAILER_SECRET          — shared secret; must match Worker MAILER_SECRET
#   CONTACT_TO             — websiteinquiry@amilliondreams.llc
#   CONTACT_FROM           — Workspace sender (jesse@amilliondreams.llc); must match Gmail OAuth user
#
# Email: Pages Function → amd-mailer Worker → Gmail API.
# Inbound: Google Workspace MX. Do not enable Cloudflare Email Routing.
